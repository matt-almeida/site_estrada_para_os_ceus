<section id="interacoes" aria-label="Personagens para interação">
  <div class="container">

    <h2 class="section-title reveal">Interações</h2>
    <div class="section-ornament reveal reveal-delay-1" aria-hidden="true">
      <div class="ornament-diamond"></div>
    </div>
    <p class="menu-intro reveal reveal-delay-2">Personagens que habitam a taberna — clique para conhecê-los.</p>

    <div class="interactions-grid">

      <!-- CARD: Grindle -->
      <a href="grindle.html" class="interaction-card reveal reveal-delay-1" aria-label="Ver página de Grindle Pisa-Pele Murren">
        <div class="interaction-card-img-wrap">
          <!--
            Imagem 3:4 do personagem.
            Arquivo: img/grindle.jpg
          -->
          <img src="img/grindle.png" alt="Grindle Pisa-Pele Murren" loading="lazy" />
          <div class="interaction-card-overlay" aria-hidden="true"></div>
        </div>
        <div class="interaction-card-info">
          <span class="interaction-card-role">Sentinela</span>
          <h3 class="interaction-card-name">Grindle<br><em>"Pisa-Pele"</em> Murren</h3>
          <span class="interaction-card-hint">Ver personagem ✦</span>
        </div>
      </a>

  </div>
</section>

/* ── INTERAÇÕES ──────────────────────────────────────────── */
.interactions-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1.5rem;
  margin-top: 0.5rem;
}

.interaction-card {
  display: block;
  text-decoration: none;
  position: relative;
  background: var(--color-bg-card);
  border: 1px solid var(--color-border);
  overflow: hidden;
  transition: border-color var(--transition), box-shadow var(--transition), transform var(--transition);
}

.interaction-card:hover {
  border-color: var(--color-gold);
  box-shadow: var(--shadow-glow), var(--shadow-deep);
  transform: translateY(-4px);
}

.interaction-card-img-wrap {
  position: relative;
  aspect-ratio: 3 / 4;
  overflow: hidden;
}

.interaction-card-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top center;
  filter: sepia(15%) brightness(0.85);
  transition: transform 0.55s ease, filter 0.4s ease;
}

.interaction-card:hover .interaction-card-img-wrap img {
  transform: scale(1.05);
  filter: sepia(8%) brightness(0.95);
}

.interaction-card-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(14,10,6,0.92) 0%, rgba(14,10,6,0.3) 45%, transparent 100%);
  transition: opacity var(--transition);
}

.interaction-card:hover .interaction-card-overlay {
  opacity: 0.8;
}

.interaction-card-info {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 1.25rem 1rem 1rem;
